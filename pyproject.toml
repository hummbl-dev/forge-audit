[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-audit"
version = "0.1.0"
description = "Read-only multi-forge topology and sync-drift auditor"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
forge-audit = "forge_audit.cli:main"

[tool.setuptools]
packages = ["forge_audit"]
